name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # 毎日 22:00 UTC = 翌 07:00 JST に自動実行
    - cron: '0 22 * * *'
  workflow_dispatch: # GitHub UI から手動実行できる

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch latest market data
        run: npm run fetch:data

      - name: Build
        run: npm run build
        env:
          # リポジトリ名が "<user>/<user>.github.io" の場合は '/' に変更
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
